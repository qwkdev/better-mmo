<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>

	<style>
:root {
	--bg: #111;
	--fg: #222;
	--fg2: #555;

	--text: #fff;
	--text-s: #fff5;
	--link: #08f;
	--link-s: #08f5;

	--u: 1.5vw;
	--top-height: calc(6 * var(--u));
	--bottom-height: calc(3 * var(--u));
	--pad: calc(3 * var(--u));
}
*[hidden] {
	display: none !important;
}

.underlined {
	color: var(--link);
	font-family: Arial;
	font-weight: 500;
	position: relative;
	transition: .2s;
	z-index: 2;
	text-decoration: none;
}
.underline {
	--widen: 0%;
	--fix: 0%;
	width: calc(100% + var(--widen));
	transform: translateX(calc(-100% + var(--fix)));
	height: 1px;
	background: var(--link);
	position: absolute;
	bottom: 0;
	transition: .2s;
	z-index: -1;
}
.underlined:hover {
	color: #000;
}
.underlined:hover .underline {
	height: 100%;
}
.underlined::selection {
	background: var(--link-s);
}

body {
	margin: 0 auto;
	overflow-x: hidden;
	position: relative;
	background: var(--bg);
	padding: 0 var(--pad);
	padding-top: calc(var(--top-height) + var(--pad));
	padding-bottom: calc(var(--bottom-height) + var(--pad));
	height: max-content;
	min-height: 100vh;
	min-height: 100dvh;
	box-sizing: border-box;

	max-width: calc(90 * var(--u));

    scrollbar-width: none;
}
body::-webkit-scrollbar {
	display: none;
}
nav {
	position: fixed;
	top: 0;
	left: 0;

	width: 100vw;
	padding: calc(1.1 * var(--u)) calc(1 * var(--u)) calc(1 * var(--u)) calc(1.5 * var(--u));
	height: var(--top-height);
	box-sizing: border-box;

	background: var(--fg);

	display: flex;
	align-items: center;
	z-index: 10;
}
#logo {
	color: var(--text);
	font-family: Arial;
	font-size: calc(3 * var(--u));
	margin: 0;

	&::selection {
		background: var(--text-s);
	}
}
#nav {
	display: flex;
	align-items: center;
	justify-content: center;
	gap: calc(.4 * var(--u));
	margin-left: auto;

	div {
		--n: -10;
		display: flex;
		align-items: center;
		justify-content: center;
		position: relative;
		width: max-content;

		background: var(--bg);
		padding: calc(.4 * var(--u)) calc(.3 * var(--u));
		box-sizing: border-box;
		border-radius: calc(1 * var(--u));
		gap: calc(.2 * var(--u));
		overflow: hidden;

		a {
			background: none;
			text-decoration: none;
			color: var(--text);
			font-family: Arial;
			font-size: calc(2 * var(--u));
			width: var(--w);
			height: calc(var(--top-height) - (2.9 * var(--u)));
			line-height: calc(var(--top-height) - (3 * var(--u)));
			text-align: center;

			box-sizing: border-box;
			padding-top: calc(.1 * var(--u));
			z-index: 11;

			&.active {
				background: var(--fg);
				color: var(--text);
			}
			&::selection {
				background: var(--text-s);
			}
		}
		&::before {
			content: '';
			position: absolute;
			top: calc(.4 * var(--u));
			left: calc((var(--w) + (.2 * var(--u))) * var(--n) + (.3 * var(--u)));

			width: var(--w);
			height: calc(var(--top-height) - (2.8 * var(--u)));
			border-radius: calc(.6 * var(--u));
			background: var(--fg);
			transition: .2s;
		}
		&[data-value="0"]::before {
			display: none;
		}
	}
}

#levels {
	--w: calc(4 * var(--u));
}
#pages {
	--w: calc(10 * var(--u));
}

footer {
	position: absolute;
	bottom: 0;
	left: 50%;
	margin-left: -50vw;

	width: 100vw;
	height: var(--bottom-height);
	background: var(--fg);
	padding: 0 calc(.8 * var(--u));
	box-sizing: border-box;

	display: flex;
	align-items: center;

	p {
		color: var(--text);
		font-family: Arial;
		font-size: calc(1.5 * var(--u));

		&:last-child {
			margin-left: auto;
		}
		&::selection {
			background: var(--text-s);
		}
	}

	.underlined {
		color: var(--text);

		&::selection {
			background: var(--text-s);
		}
	}
	.underline {
		background: var(--text);
	}
}

#header {
	color: var(--text);
	font-family: Arial;
	font-size: calc(3.5 * var(--u));
	font-weight: 700;

	margin: 0;
	margin-bottom: calc(2 * var(--u));

	&::selection {
		background: var(--text-s);
	}
}

table {
	width: 100%;
	table-layout: fixed;
	border-spacing: 0;
	--corner: calc(1 * var(--u));

	th, td {
		width: auto;
		text-align: left;
		color: var(--text);
		font-family: Arial;
		padding: calc(1 * var(--u)) 0;
		font-size: calc(2 * var(--u));

		&::selection {
			background: var(--text-s);
		}
	}
	th {
		font-weight: 700;
	}
	td {		
		font-weight: 500;
	}

}

#concept {
	display: flex;
	flex-direction: column;
	gap: calc(2 * var(--u));
	height: max-content;

	h2, p {
		color: var(--text);
		font-family: Arial;
		font-size: calc(2 * var(--u));
		margin: 0;

		&::selection {
			background: var(--text-s);
		}
	}
	h2 {
		font-size: calc(2.5 * var(--u));
	}
	img {
		width: min-content;
		height: max-content;
		max-width: 50vw;
		max-height: 30vh;
		object-fit: contain;
		border-radius: calc(1 * var(--u));
	}
	table img {
		width: 50%;
	}

	#related {
		margin-top: calc(2 * var(--u));

		display: flex;
		flex-direction: column;
		gap: calc(1 * var(--u));
	}
	#back {
		margin-top: calc(2 * var(--u));
	}
}

.audio {
	width: max-content;
	background: var(--fg);
	border-radius: calc(1 * var(--u));
	height: calc(4 * var(--u));
	display: flex;
	align-items: center;

	padding-left: calc(.8 * var(--u));
	padding-right: calc(1 * var(--u));
	gap: calc(.5 * var(--u));

	audio {
		display: none;
	}

	button {
		position: relative;
		aspect-ratio: 1/1;
		height: 100%;
		background: none;
		border: none;

		&:focus {
			outline: none;
		}
	}
	svg {
		position: absolute;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		
		height: 60%;
		aspect-ratio: 1/1;
		stroke: var(--text);
	}
	&[data-value="0"] button svg:last-child {
		display: none;
	}
	&[data-value="1"] button svg:first-child {
		display: none;
	}

	input {
		appearance: none;
		-webkit-appearance: none;
		background: transparent;
		cursor: pointer;
		width: calc(20 * var(--u));
		position: relative;
		--fill: 0%;
	}
	input::-webkit-slider-runnable-track {
		background: linear-gradient(to right, #08f var(--fill), var(--fg2) var(--fill)) !important;
		border-radius: calc(1 * var(--u));
		height: calc(1 * var(--u));
	}
	input::-moz-range-track {
		background: linear-gradient(to right, #08f var(--fill), var(--fg2) var(--fill)) !important;
		border-radius: calc(1 * var(--u));
		height: calc(1 * var(--u));
	}
	input::-webkit-slider-thumb {
		-webkit-appearance: none;
		appearance: none;
		margin-top: calc(-.27 * var(--u));
		border: none;
		border-radius: 50%;
		background-color: #ccc;
		width: calc(1.5 * var(--u));
		height: calc(1.5 * var(--u));
	}
	input::-moz-range-thumb {
		border: none;
		border-radius: 50%;
		background-color: #ccc;
		width: calc(1.5 * var(--u));
		height: calc(1.5 * var(--u));
	}

	span {
		font-family: Arial;
		color: var(--text);
		font-size: calc(1.75 * var(--u));
		white-space: nowrap;
    	font-variant-numeric: tabular-nums;
		padding-left: calc(.5 * var(--u));

		&::selection {
			background: var(--text-s);
		}
	}
}

@media screen and (min-aspect-ratio: 2/3) {
	:root {
		--u: 1vh;
	}
}
	</style>
</head>
<body>
	<svg hidden>
		<symbol id="icon-pause" viewbox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M8 5V19M16 5V19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
		</symbol>
		<symbol id="icon-play" viewbox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
			<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g><path d="M16.6582 9.28638C18.098 10.1862 18.8178 10.6361 19.0647 11.2122C19.2803 11.7152 19.2803 12.2847 19.0647 12.7878C18.8178 13.3638 18.098 13.8137 16.6582 14.7136L9.896 18.94C8.29805 19.9387 7.49907 20.4381 6.83973 20.385C6.26501 20.3388 5.73818 20.0469 5.3944 19.584C5 19.053 5 18.1108 5 16.2264V7.77357C5 5.88919 5 4.94701 5.3944 4.41598C5.73818 3.9531 6.26501 3.66111 6.83973 3.6149C7.49907 3.5619 8.29805 4.06126 9.896 5.05998L16.6582 9.28638Z" stroke-width="2" stroke-linejoin="round"></path> </g></svg>
		</symbol>
	</svg>

	<nav>
		<h1 id="logo">..cggikmqsuw</h1>
		<div id="nav">
			<div id="levels" data-value="0" style="--n: -10;">
				<a data-v="n3">N3</a>
				<a data-v="n4">N4</a>
				<a data-v="n5">N5</a>
				<a data-v="h">H</a>
				<a data-v="ah">AH</a>
			</div>
			<div id="pages" data-value="0" style="--n: -10;">
				<a data-v="c">Concepts</a>
				<a data-v="q">Quizzes</a>
			</div>
		</div>
	</nav>

	<div id="content">
		<h1 id="header">Loading...</h1>
	</div>

	<footer>
		<p></p>
		<p>Made by <span><a class="underlined" href="https://qwk.gg/" target="_blank">qwk<span class="underline"></span></a></span></p>
	</footer>
	<script>
		let navdata = [null, null];
		// let path = window.location.pathname.slice(1).split('/');
		let path = ['c', 'triplets'];

		function playPause(ele) {
			const audio = ele.parentElement.querySelector('audio');
			ele.parentElement.dataset.value = audio.paused ? '1' : '0';
			if (audio.paused) audio.play();
			else audio.pause();
		}
		function setTimestamp(audio) {
			let curm = Math.floor(audio.currentTime / 60);
			let curs = Math.floor(audio.currentTime - (curm * 60));
			let totm = Math.floor(audio.duration / 60);
			let tots = Math.floor(audio.duration - (totm * 60));
			audio.parentElement.querySelector('span').innerText = `${curm < 10 ? '0' : ''}${curm}:${curs < 10 ? '0' : ''}${curs}/${totm < 10 ? '0' : ''}${totm}:${tots < 10 ? '0' : ''}${tots}`;
		}
		function audioSeek(ele, value, noAudio=false) {
			const audio = ele.parentElement.querySelector('audio');
			ele.value = value;
			ele.style.setProperty('--fill', `${value}%`);
			if (!noAudio) audio.currentTime = (value / 100) * audio.duration;
			setTimestamp(audio);
		}

		function addAudio(url, parent) {
			const ele = document.createElement('div');
			ele.classList.add('audio');
			ele.dataset.value = '0';
			ele.innerHTML = [
				`<audio src=${url}></audio>`,
				'<button onclick="playPause(this)">',
					'<svg><use href="#icon-play"/></svg>',
					'<svg><use href="#icon-pause"/></svg>',
				'</button>',
				'<input type="range" value="0" min="0" max="100" onchange="audioSeek(this, this.value)">',
				'<span>0:00/0:00</span>'
			].join('');

			parent.appendChild(ele);
			const slider = ele.querySelector('input');
			const audio = ele.querySelector('audio');

			setTimeout(() => audioSeek(slider, 0), 500);
			audio.addEventListener('loadedmetadata', () => audioSeek(slider, 0));
			audio.addEventListener('timeupdate', () => {
				audioSeek(slider, (audio.currentTime / audio.duration) * 100, true);
				setTimestamp(audio);
				ele.dataset.value = audio.paused ? '0' : '1';
			});
		}
		function addText(text, parent) {
			const lines = text.split('\n');
			lines.forEach((line, n) => {
				parent.appendChild(document.createTextNode(line));
				if (n < lines.length - 1) parent.appendChild(document.createElement('br'));
			});
		}
		function makeLink(url, text) {
			const a = document.createElement('span');
			a.innerHTML = `<a class="underlined" href="${url}" onclick="handleLink(event)">${text}<span class="underline"></span></a>`;
			return a;
		}

		function renderPreset(name) {
			const content = document.getElementById('content');
			const header = document.getElementById('header');
			header.textContent = 'Preset: '+name;
		}

		function render() {
			navdata = [null, null];
			path = window.location.pathname.slice(1) ? window.location.pathname.slice(1).split('/') : ['c', 'n5'];
			if (['c', 'q'].includes(path[0])) navdata[0] = path[0];
			if (['n3', 'n4', 'n5', 'h', 'ah'].includes(path[1])) navdata[1] = path[1];
			else if (navdata[0] === 'c' && !navdata[1] && DATA[path[1]]) navdata[1] = DATA[path[1]].level;

			const levelSel = document.getElementById('levels');
			const levelTab = ['n3', 'n4', 'n5', 'h', 'ah'].indexOf(navdata[1]);
			levelSel.dataset.value = levelTab >= 0 ? "1" : "0";
			levelSel.style.setProperty('--n', levelTab >= 0 ? levelTab : -10);

			const pageSel = document.getElementById('pages');
			const pageTab = ['c', 'q'].indexOf(navdata[0]);
			pageSel.dataset.value = pageTab >= 0 ? "1" : "0";
			pageSel.style.setProperty('--n', pageTab >= 0 ? pageTab : -10);
			
			levelSel.querySelectorAll('a').forEach(e => {
				e.href = `/${navdata[0] || 'c'}/${e.dataset.v}`;
				e.onclick = handleLink;
			});
			pageSel.querySelectorAll('a').forEach(e => {
				e.href = `/${e.dataset.v}/${navdata[1] || 'n5'}`;
				e.onclick = handleLink;
			});

			const content = document.getElementById('content');
			content.innerHTML = '';
			const header = document.createElement('h1');
			header.id = 'header';
			content.appendChild(header);

			let built = false;
			if (navdata[0] === 'c') {
				if (['n3', 'n4', 'n5', 'h', 'ah'].includes(path[1])) {
					

					buildTable(clist, content);
				} else {
					const cdata = DATA[path[1]];
					if (cdata) {
						console.log(cdata);
						header.textContent = cdata.name;

						const concept = document.createElement('div');
						concept.id = 'concept';
						buildConcept(cdata, concept);
						content.appendChild(concept);
						built = true;
					}
				}
			}

			if (!built) renderPreset('404');
		}

		function buildConcept(data, parent) {
			let current;
			for (const e of data.desc) {
				if (typeof e === 'string') {
					if (!current) current = document.createElement('p');
					addText(e, current);
					continue;
				}
				if (e[0] === 'link') {
					if (!current) current = document.createElement('p');
					current.appendChild(makeLink(e[1], e[2]));
					continue
				}
				if (!['audio', 'table', 'image'].includes(e[0])) continue;
				
				if (current) parent.appendChild(current);
				current = undefined;

				switch (e[0]) {
					case 'audio':
						addAudio(e[1], parent);
						break;
					case 'table':
						buildTable(e[1], parent);
						break;
					case 'image':
						const img = document.createElement('img');
						img.src = e[1];
						parent.appendChild(img);
						break;
				}
			}
			if (current) parent.appendChild(current);

			if (data.rel) {
				const relWrapper = document.createElement('div');
				relWrapper.id = 'related';

				const relHeader = document.createElement('h2');
				relHeader.textContent = 'Related Concepts:'
				relWrapper.appendChild(relHeader);

				const relList = document.createElement('p');
				data.rel.forEach((c, n) => {
					relList.appendChild(makeLink('/c/'+c, DATA[c]?.name));
					if (n < data.rel.length - 1) relList.appendChild(document.createTextNode(', '));
				});
				relWrapper.appendChild(relList);
				parent.appendChild(relWrapper);
			}

			const back = document.createElement('p');
			back.id = 'back';
			back.appendChild(makeLink('/c/'+data.level, `Back to ${data.level.toUpperCase()} Music`));
			parent.appendChild(back);
		}

		function buildTable(data, parent) {
			const table = document.createElement('table');
			data.forEach((r, n) => {
				const row = document.createElement('tr');
				r.forEach(e => {
					const ele = document.createElement(n === 0 ? 'th' : 'td');

					if (typeof e === 'string') addText(e, ele);
					else switch (e[0]) {
						case 'link':
							ele.appendChild(makeLink(e[1], e[2]));
							break;
						case 'audio':
							addAudio(e[1], ele);
							break;
						case 'image':
							const img = document.createElement('img');
							img.src = e[1];
							ele.appendChild(img);
							break;
					}

					row.appendChild(ele);
				});
				table.appendChild(row);
			});
			parent.appendChild(table);
		}

		function redir(url) {
			history.pushState({}, '', url);
			render();
		}
		function handleLink(e) {
			e.preventDefault();
			redir(e.target.href);
		}
		window.addEventListener('popstate', render);

		let DATA = [];
		fetch('/data.json')
			.then(d => d.json())
			.then(r => DATA = r)
			.catch(console.error)
			.then(render);
	</script>
